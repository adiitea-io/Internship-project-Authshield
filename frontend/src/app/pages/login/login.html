<div class="login-page">

    <div class="login-card">

        <span class="brand">AUTHSHIELD</span>

        <h1>Welcome back</h1>

        <p class="subtitle">
            Sign in to continue
        </p>

        <form class="login-form">

            <div class="form-group">
                <label>Email</label>

                <input pInputText type="email" placeholder="you@example.com" [(ngModel)]="email" name="email" />

            </div>

            <div class="form-group">
                <label>Password</label>

                <p-password [(ngModel)]="password" name="password" placeholder="Enter your password" [feedback]="false"
                    [toggleMask]="true">
                </p-password>

            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password</a>
            </div>

            <p-button label="Sign In"></p-button>


            <div class=" divider">
                <span>OR</span>
            </div>

            <p class="register-link">
                Don't have an account?
                <a href="#">Create one</a>
            </p>

        </form>




    </div>

</div>
